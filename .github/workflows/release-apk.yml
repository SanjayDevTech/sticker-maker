name: Release APK

# Manual only: Actions → Release APK → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # x64 on purpose: the NDK ships no Linux arm64 host build.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Same JDK the build runs on (gradle/gradle-daemon-jvm.properties), so Gradle doesn't
      # download another one.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle's dependencies and build cache between runs.
      - uses: gradle/actions/setup-gradle@v6

      # Pinned in app/build.gradle.kts; installed up front so the build doesn't fetch them mid-way.
      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      # Signed with the public github-public-release key committed in the repo. The first build
      # downloads libwebp (pinned, SHA-256 checked) for the native encoder.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK after the commit
        id: apk
        run: |
          name="StickerMaker-${GITHUB_SHA::7}-release"
          mv app/build/outputs/apk/release/app-release.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Unzipped: the artifact is the .apk itself, named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.name }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
